name: Fetch Topic Pool

on:
  schedule:
    # প্রতিদিন IST সকাল ৫টা, দুপুর ১টা, সন্ধ্যা ৫টা-র কাছাকাছি (UTC = IST - 5:30)
    - cron: "30 23 * * *"   # ~সকাল ৫টা IST
    - cron: "30 7 * * *"    # ~দুপুর ১টা IST
    - cron: "30 11 * * *"   # ~সন্ধ্যা ৫টা IST
  workflow_dispatch: {}      # ম্যানুয়ালি Run বাটন থেকেও চালানো যাবে

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Qwen model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models
          key: qwen2.5-3b-instruct-q4km-v1

      - name: Download model (only on cache miss)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L -o models/qwen2.5-3b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"

      - name: Install dependencies
        run: pip install -r requirements.txt --prefer-binary

      - name: Fetch and store topics
        env:
          MODEL_PATH: models/qwen2.5-3b-instruct-q4_k_m.gguf
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m scripts.fetch_topics
