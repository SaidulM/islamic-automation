name: Telegram Handler

on:
  repository_dispatch:
    types: [telegram_message]

jobs:
  handle:
    runs-on: ubuntu-latest
    # ⚡ কোনো মডেল ডাউনলোড/ক্যাশ লাগে না — Groq API সরাসরি কল হয়, তাই দ্রুত চলে
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run handler
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MESSAGE_TEXT: ${{ github.event.client_payload.text }}
          TRIGGER_SOURCE: telegram
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m scripts.handle_message
